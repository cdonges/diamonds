services:
  app:
    # Published by .github/workflows/docker-ghcr.yml on every push to main.
    image: ghcr.io/cdonges/diamonds:latest
    pull_policy: always
    container_name: diamonds-online
    ports:
      - "3100:3000"
    environment:
      - PORT=3000
    restart: unless-stopped

# Run with:
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Update to the newest image with:
#   docker compose -f docker-compose.ghcr.yml pull && docker compose -f docker-compose.ghcr.yml up -d
